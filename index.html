<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>謎解き</title>
  <style>
    :root{--ink:#1e3550;--green:#8eae4d;--green-dark:#6e8d32;--paper:#fff;--bg:#f7f9f4;--line:#dfe7d5;--muted:#6b7280;--wrong:#b44b3d}
    *{box-sizing:border-box}body{margin:0;color:#182536;background:var(--bg);font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",Meiryo,sans-serif}.wrap{width:min(820px,calc(100% - 32px));margin:auto;padding:48px 0 72px}header{text-align:center;margin-bottom:25px}.eyebrow{margin:0 0 8px;color:var(--green-dark);font-size:.8rem;letter-spacing:.2em;font-weight:700}h1{margin:0;color:var(--ink);font-size:clamp(2rem,5vw,3rem);font-weight:400;letter-spacing:.12em}.sub{margin:10px 0 0;color:var(--muted)}.card{padding:26px;border:1px solid var(--line);border-radius:18px;background:var(--paper);box-shadow:0 10px 28px #1937560d}.meta{display:flex;justify-content:space-between;gap:10px;margin-bottom:17px;color:var(--muted);font-size:.83rem}.puzzle-title{margin:0 0 18px;color:var(--ink);font-size:1.35rem}.problem{padding:22px 20px;border-radius:12px;background:#f7faF2;color:#182536;font-size:1.08rem;line-height:1.9;white-space:pre-wrap}.answer-area{margin-top:22px}.answer-label{display:block;margin-bottom:8px;color:var(--ink);font-weight:700}.answer-row{display:flex;gap:10px}input{min-width:0;flex:1;padding:13px 14px;border:1px solid #cbd5bf;border-radius:9px;font:inherit;font-size:1rem}input:focus{outline:none;border-color:var(--green-dark);box-shadow:0 0 0 3px #8eae4d33}button{padding:12px 18px;border:0;border-radius:9px;color:#fff;background:var(--green-dark);font:inherit;font-weight:700;cursor:pointer}button:hover{filter:brightness(.95)}button.secondary{color:var(--ink);background:#edf3e5}.message{min-height:22px;margin:10px 0 0;font-size:.9rem}.message.wrong{color:var(--wrong)}.message.correct{color:var(--green-dark);font-weight:700}.hints{margin-top:20px;display:grid;gap:9px}.hints-heading{margin:0 0 2px;color:var(--ink);font-size:1rem}details{border:1px solid var(--line);border-radius:10px;background:#fcfdfb}summary{padding:13px 15px;color:var(--ink);font-weight:700;cursor:pointer}details p{margin:0;padding:0 15px 15px;color:#374151;line-height:1.65}.solution{display:none;margin-top:20px;padding:20px;border:2px solid var(--green);border-radius:12px;background:#fbfdf8}.solution.visible{display:block}.solution h2{margin:0 0 12px;color:var(--green-dark);font-size:1.1rem}.solution-answer{margin:0 0 10px;color:var(--ink);font-size:1.45rem;font-weight:800}.solution p{margin:0;color:#374151;line-height:1.7}.bottom{display:flex;justify-content:space-between;gap:10px;margin-top:18px}.score{color:var(--muted);font-size:.85rem;align-self:center}@media(max-width:560px){.wrap{width:calc(100% - 22px);padding-top:30px}.card{padding:18px}.answer-row{flex-direction:column}.answer-row button{width:100%}.bottom{flex-direction:column}.bottom button{width:100%}}
  </style>
</head>
<body>
  <main class="wrap">
    <header><p class="eyebrow">MYSTERY PUZZLE</p><h1>謎解き</h1><p class="sub">問題文から手がかりを見つけて、答えを入力してください。</p></header>
    <section class="card" aria-labelledby="puzzleTitle">
      <div class="meta"><span id="number">第1問</span><span id="progress">1 / 2</span></div>
      <h2 id="puzzleTitle" class="puzzle-title"></h2>
      <div id="problem" class="problem"></div>
      <div class="answer-area"><label class="answer-label" for="answer">答え</label><div class="answer-row"><input id="answer" type="text" autocomplete="off" placeholder="答えを入力"><button id="submit">回答する</button></div><p id="message" class="message" role="status" aria-live="polite"></p></div>
      <section class="hints" aria-labelledby="hintHeading"><h3 id="hintHeading" class="hints-heading">ヒント</h3><details><summary>ヒント1を見る</summary><p id="hint1"></p></details><details><summary>ヒント2を見る</summary><p id="hint2"></p></details><details><summary>ヒント3を見る</summary><p id="hint3"></p></details></section>
      <section id="solution" class="solution" aria-live="polite"><h2>正解・解説</h2><p id="solutionAnswer" class="solution-answer"></p><p id="explanation"></p></section>
      <div class="bottom"><span id="score" class="score">正解数：0</span><button id="next" class="secondary" hidden>次の問題へ</button></div>
    </section>
  </main>
  <script>
    (()=>{
      // 問題データは表示用HTMLとは分離し、ここで管理します。実運用ではAPIやJSONに置き換え可能です。
      const puzzles=[
        {title:'消えた文字',problem:'すいか → いか\nみかん → かん\nさくら → ？',hints:['どちらも、元の言葉の最初の文字が消えています。','「さくら」の最初の1文字を確認してください。','残った3文字を、そのまま答えにします。'],answer:'くら',explanation:'「すいか」から「す」を取ると「いか」、「みかん」から「み」を取ると「かん」になります。同じ規則で「さくら」から最初の「さ」を取るので、答えは「くら」です。'},
        {title:'順番の暗号',problem:'次の言葉は、ある規則で短くなっています。\n「りんご」→「ご」\n「うみ」→「み」\nでは、「たまご」は何になるでしょう？',hints:['最後に残っている文字に注目してください。','元の言葉の最後の1文字だけが答えになります。','「たまご」の最後の文字を書いてください。'],answer:'ご',explanation:'どちらも元の言葉の末尾だけを残しています。「たまご」の最後の文字は「ご」なので、答えは「ご」です。'}
      ];
      let index=0,correct=0;const $=id=>document.getElementById(id);
      function render(){const p=puzzles[index];$('number').textContent=`第${index+1}問`;$('progress').textContent=`${index+1} / ${puzzles.length}`;$('puzzleTitle').textContent=p.title;$('problem').textContent=p.problem;$('hint1').textContent=p.hints[0];$('hint2').textContent=p.hints[1];$('hint3').textContent=p.hints[2];$('answer').value='';$('message').textContent='';$('message').className='message';$('solution').className='solution';$('solutionAnswer').textContent=`答え：${p.answer}`;$('explanation').textContent=p.explanation;$('next').hidden=true;$('score').textContent=`正解数：${correct}`}
      function answer(){const p=puzzles[index],value=$('answer').value.trim();if(!value){$('message').textContent='答えを入力してください。';$('message').className='message wrong';return}if(value===p.answer){correct++;$('message').textContent='正解です！';$('message').className='message correct';$('solution').className='solution visible';$('score').textContent=`正解数：${correct}`;$('next').hidden=index===puzzles.length-1}else{$('message').textContent='惜しいです。ヒントを確認して、もう一度考えてみてください。';$('message').className='message wrong'}}
      $('submit').onclick=answer;$('answer').addEventListener('keydown',e=>{if(e.key==='Enter')answer()});$('next').onclick=()=>{index=(index+1)%puzzles.length;render()};render();
    })();
  </script>
</body>
</html>
