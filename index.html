<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>謎解き</title>
  <style>
    :root{--ink:#1e3550;--green:#8eae4d;--green-dark:#6e8d32;--paper:#fff;--bg:#f7f9f4;--line:#dfe7d5;--muted:#6b7280;--wrong:#b44b3d}
    *{box-sizing:border-box}body{margin:0;color:#182536;background:var(--bg);font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",Meiryo,sans-serif}.wrap{width:min(820px,calc(100% - 32px));margin:auto;padding:48px 0 72px}header{text-align:center;margin-bottom:25px}.eyebrow{margin:0 0 8px;color:var(--green-dark);font-size:.8rem;letter-spacing:.2em;font-weight:700}h1{margin:0;color:var(--ink);font-size:clamp(2rem,5vw,3rem);font-weight:400;letter-spacing:.12em}.sub{margin:10px 0 0;color:var(--muted)}.card{padding:26px;border:1px solid var(--line);border-radius:18px;background:var(--paper);box-shadow:0 10px 28px #1937560d}.meta{display:flex;justify-content:space-between;gap:10px;margin-bottom:17px;color:var(--muted);font-size:.83rem}.puzzle-title{margin:0 0 18px;color:var(--ink);font-size:1.35rem}.problem{padding:22px 20px;border-radius:12px;background:#f7faF2;color:#182536;font-size:1.08rem;line-height:1.9;white-space:pre-wrap}.answer-area{margin-top:22px}.answer-label{display:block;margin-bottom:8px;color:var(--ink);font-weight:700}.answer-row{display:flex;gap:10px}input{min-width:0;flex:1;padding:13px 14px;border:1px solid #cbd5bf;border-radius:9px;font:inherit;font-size:1rem}input:focus{outline:none;border-color:var(--green-dark);box-shadow:0 0 0 3px #8eae4d33}button{padding:12px 18px;border:0;border-radius:9px;color:#fff;background:var(--green-dark);font:inherit;font-weight:700;cursor:pointer}button:hover{filter:brightness(.95)}button.secondary{color:var(--ink);background:#edf3e5}.message{min-height:22px;margin:10px 0 0;font-size:.9rem}.message.wrong{color:var(--wrong)}.message.correct{color:var(--green-dark);font-weight:700}.hints{margin-top:20px;display:grid;gap:9px}.hints-heading{margin:0 0 2px;color:var(--ink);font-size:1rem}details{border:1px solid var(--line);border-radius:10px;background:#fcfdfb}summary{padding:13px 15px;color:var(--ink);font-weight:700;cursor:pointer}details p{margin:0;padding:0 15px 15px;color:#374151;line-height:1.65}.solution{display:none;margin-top:20px;padding:20px;border:2px solid var(--green);border-radius:12px;background:#fbfdf8}.solution.visible{display:block}.solution h2{margin:0 0 12px;color:var(--green-dark);font-size:1.1rem}.solution-answer{margin:0 0 10px;color:var(--ink);font-size:1.45rem;font-weight:800}.solution p{margin:0;color:#374151;line-height:1.7}.bottom{display:flex;justify-content:space-between;gap:10px;margin-top:18px}.score{color:var(--muted);font-size:.85rem;align-self:center}@media(max-width:560px){.wrap{width:calc(100% - 22px);padding-top:30px}.card{padding:18px}.answer-row{flex-direction:column}.answer-row button{width:100%}.bottom{flex-direction:column}.bottom button{width:100%}}
    .judge-result{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-top:20px;padding:16px;border-radius:10px;background:#f3f8ed}.judge-result strong{color:var(--green-dark);font-size:2rem}.judge-result span{color:var(--muted);font-size:.9rem}
    .input-card{display:grid;gap:9px;margin-bottom:18px}.input-card label{color:var(--ink);font-weight:700}.input-card select{padding:12px;border:1px solid #cbd5bf;border-radius:9px;font:inherit;background:#fff}
  </style>
  <style>.candidate-list{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px;max-height:190px;overflow:auto;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fcfdfb}.candidate-word{display:inline-flex;align-items:center;gap:6px;padding:4px 7px 4px 9px;border-radius:99px;color:var(--ink);background:#edf3e5;font-size:.85rem}.candidate-word.chosen{background:#dcebc4}.candidate-word button{padding:3px 7px;border-radius:99px;font-size:.72rem}</style>
</head>
<style>.puzzle-title{display:none!important}</style>
<body>
  <main class="wrap">
    <header><p class="eyebrow">MYSTERY PUZZLE</p><h1>謎解き</h1><p class="sub">問題文から手がかりを見つけて、答えを入力してください。</p></header>
    <section class="card source-card"><div class="meta"><strong>単語候補一覧（ここで精査）</strong><span id="candidateCount">読み込み中</span></div><p class="sub">単語を確認して「採用」を押してください。採用した単語だけが問題生成に使われます。</p><input id="candidateSearch" type="search" placeholder="単語を検索"><div id="candidateList" class="candidate-list"></div><p id="selectionMessage" class="hint"></p><button id="aiGenerate" type="button">AIで問題を作る</button><p id="aiMessage" class="hint" role="status"></p></section>
    <section class="card input-card"><div class="meta"><strong>③ 入力</strong><span>未入力なら自動</span></div><label for="sourceWord">1. A → ？（新単語から）</label><input id="sourceWord" type="text" placeholder="例：いか"><label for="answerWord">2. ？ → B（元単語から）</label><input id="answerWord" type="text" placeholder="例：すいか"><label for="ruleSelect">3. 規則</label><select id="ruleSelect"><option value="自動">自動で選ぶ</option><option>先頭1文字削除</option><option>末尾1文字削除</option><option>中間1文字削除</option><option>先頭1文字追加</option><option>末尾1文字追加</option><option>中間1文字追加</option><option>濁点・清音変換</option><option>半濁点変換</option><option>母音変換</option><option>子音スライド</option><option>逆読み</option><option>並び替え</option></select><label for="themeSelect">4. テーマ</label><select id="themeSelect"><option value="">指定なし</option><option>ファンタジー</option><option>海</option><option>宇宙</option><option>未来</option></select><button id="customGenerate" type="button">入力条件で生成</button><p id="customMessage" class="hint"></p></section>
    <section class="card" aria-labelledby="puzzleTitle">
      <div class="meta"><span id="number">第1問</span><span id="progress">1 / 2</span></div>
      <h2 id="puzzleTitle" class="puzzle-title"></h2>
      <div id="problem" class="problem"></div>
      <div class="answer-area"><label class="answer-label" for="answer">答え</label><div class="answer-row"><input id="answer" type="text" autocomplete="off" placeholder="答えを入力"><button id="submit">回答する</button></div><p id="message" class="message" role="status" aria-live="polite"></p></div>
      <section class="hints" aria-labelledby="hintHeading"><h3 id="hintHeading" class="hints-heading">ヒント</h3><details><summary>ヒント1を見る</summary><p id="hint1"></p></details><details><summary>ヒント2を見る</summary><p id="hint2"></p></details><details><summary>ヒント3を見る</summary><p id="hint3"></p></details></section>
      <section id="solution" class="solution" aria-live="polite"><h2>正解・解説</h2><p id="solutionAnswer" class="solution-answer"></p><p id="explanation"></p></section>
      <section aria-label="判定結果"><div class="judge-result"><strong id="judgeScore">—</strong><span id="judgeMessage">判定結果</span></div></section>
      <div class="bottom"><span id="correctCount" class="score">正解数：0</span><button id="next" class="secondary" hidden>次の問題へ</button></div>
    </section>
  </main>
  <script src="unidic_candidates.js"></script><script src="generated_pairs.js"></script>
  <script>
    (()=>{
      // 問題データは表示用HTMLとは分離し、ここで管理します。実運用ではAPIやJSONに置き換え可能です。
      const samplePuzzles=[
        {title:'消えた文字',problem:'すいか → いか\nみかん → かん\nさくら → ？',hints:['どちらも、元の言葉の最初の文字が消えています。','「さくら」の最初の1文字を確認してください。','残った3文字を、そのまま答えにします。'],answer:'くら',explanation:'「すいか」から「す」を取ると「いか」、「みかん」から「み」を取ると「かん」になります。同じ規則で「さくら」から最初の「さ」を取るので、答えは「くら」です。'},
        {title:'順番の暗号',problem:'次の言葉は、ある規則で短くなっています。\n「りんご」→「ご」\n「うみ」→「み」\nでは、「たまご」は何になるでしょう？',hints:['最後に残っている文字に注目してください。','元の言葉の最後の1文字だけが答えになります。','「たまご」の最後の文字を書いてください。'],answer:'ご',explanation:'どちらも元の言葉の末尾だけを残しています。「たまご」の最後の文字は「ご」なので、答えは「ご」です。'}
      ];
      let index=0,correct=0;const $=id=>document.getElementById(id);
      const kana=/^[ぁ-んァ-ン]{2,4}$/;
      function parseCsv(text){const rows=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const ch=text[i],next=text[i+1];if(ch==='"'&&quoted&&next==='"'){cell+='"';i++}else if(ch==='"'){quoted=!quoted}else if(ch===','&&!quoted){row.push(cell);cell=''}else if((ch==='\\n'||ch==='\\r')&&!quoted){if(ch==='\\r'&&next==='\\n')i++;row.push(cell);if(row.some(Boolean))rows.push(row);row=[];cell=''}else cell+=ch}if(cell||row.length){row.push(cell);rows.push(row)}return rows}
      function buildPairs(csv){const dict=new Set();parseCsv(csv).forEach(row=>{const word=(row[0]||'').trim(),pos=(row[4]||'').trim();if((pos==='名詞'||pos==='副詞')&&kana.test(word)&&!/(.)\\1{2,}/.test(word))dict.add(word)});const pairs=[...dict].filter(w=>w.length>=3&&dict.has(w.slice(1))).map(source=>({source,answer:source.slice(1)}));return {dict,pairs}}
      function makePuzzles(pairs){if(pairs.length<3)throw new Error('成立する単語ペアが3組未満です。');const preferred=['すいか','みかん','さくら'].map(source=>pairs.find(p=>p.source===source)).filter(Boolean);const pool=preferred.length===3?[preferred[2],...pairs.slice(0,27)]:pairs.slice(0,Math.min(30,pairs.length));return pool.map((main,i,all)=>{const examples=preferred.length===3&&i===0?[preferred[0],preferred[1]]:all.filter(p=>p.source!==main.source).slice(0,2);return {title:'生成された謎',problem:`${examples[0].source} → ${examples[0].answer}\n${examples[1].source} → ${examples[1].answer}\n${main.source} → ？`,hints:['矢印の前後で、文字の位置・数・音の変化を比べてみよう。',`元の単語は${main.source.length}文字、答えは${main.answer.length}文字です。`,`例題の「${examples[0].source}」にも「${examples[0].rule}」が使われています。`],answer:main.answer,explanation:`「${main.source}」に「${main.rule}」を適用すると「${main.answer}」になります。`}})}
      let puzzles=window.generatedPairs?makePuzzles(window.generatedPairs):samplePuzzles;
      $('aiGenerate').addEventListener('click',async()=>{const words=[...accepted];if(words.length<3){$('aiMessage').textContent='採用単語を3語以上用意してください。';return}$('aiMessage').textContent='単語を探索し、AIが規則・問題・ヒントを考えています…';try{const response=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({words})});const data=await response.json();if(!response.ok)throw new Error(data.error||'AI生成に失敗しました');puzzles=(data.puzzles||[data.puzzle]).map(p=>{p.problem=Array.isArray(p.problem)?p.problem.join('\n'):p.problem;p.aiUsed=data.aiUsed;return p});index=0;render();$('aiMessage').textContent=`単語${data.wordCount}語から${data.pairCount}組を探索し、${data.aiUsed?'AI':'自動処理'}で${puzzles.length}問生成しました。`; }catch(error){$('aiMessage').textContent=`AIサーバーを起動してください（${error.message}）`;}});
      $('customGenerate').addEventListener('click',async()=>{const words=[...accepted],newWord=$('sourceWord').value.trim(),originalWord=$('answerWord').value.trim(),rule=$('ruleSelect').value,theme=$('themeSelect').value;$('customMessage').textContent='入力条件で単語を探索しています…';try{const response=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({words,source:originalWord,answer:newWord,rule,theme})});const data=await response.json();if(!response.ok)throw new Error(data.error||'生成できませんでした');const p=data.puzzle;p.problem=Array.isArray(p.problem)?p.problem.join('\n'):p.problem;puzzles=[p];index=0;render();$('customMessage').textContent=`${data.aiUsed?'AI':'自動処理'}で生成しました。`; }catch(error){$('customMessage').textContent=error.message;}});
      const candidates=window.unidicCandidates||[],saved=JSON.parse(localStorage.getItem('accepted-riddle-words')||'null'),accepted=new Set(saved||((window.generatedPairs||[]).flatMap(p=>[p.source,p.answer])));function renderCandidates(){const query=$('candidateSearch').value.trim();const shown=candidates.filter(word=>!query||word.includes(query)).slice(0,300);$('candidateCount').textContent=`候補${candidates.length.toLocaleString()}語・採用${accepted.size}語（表示${shown.length}語）`;$('candidateList').innerHTML=shown.map(word=>`<span class="candidate-word ${accepted.has(word)?'chosen':''}">${word}<button type="button" data-word="${word}">${accepted.has(word)?'採用済み':'採用'}</button></span>`).join('')||'<span>見つかりません</span>';$('selectionMessage').textContent='採用した単語を3語以上そろえると、下の問題に反映されます。'}$('candidateSearch').addEventListener('input',renderCandidates);$('candidateList').addEventListener('click',event=>{const button=event.target.closest('[data-word]');if(!button)return;const word=button.dataset.word;if(accepted.has(word))accepted.delete(word);else accepted.add(word);localStorage.setItem('accepted-riddle-words',JSON.stringify([...accepted]));const selectedPairs=(window.generatedPairs||[]).filter(p=>accepted.has(p.source)&&accepted.has(p.answer));if(selectedPairs.length>=3){puzzles=makePuzzles(selectedPairs);index=0;render()}renderCandidates()});renderCandidates();
      $('lexFile')?.addEventListener('change',async()=>{const file=$('lexFile').files[0];if(!file)return;try{const {dict,pairs}=buildPairs(await file.text());puzzles=makePuzzles(pairs);index=0;render();$('sourceMessage').textContent=`辞書${dict.size}語から${pairs.length}組を生成しました。`;$('sourceMessage').className='message correct'}catch(error){$('sourceMessage').textContent=error.message;$('sourceMessage').className='message wrong'}});
      function editDistance(a,b){const row=Array.from({length:b.length+1},(_,i)=>i);for(let i=1;i<=a.length;i++){let prev=row[0];row[0]=i;for(let j=1;j<=b.length;j++){const temp=row[j],cost=a[i-1]===b[j-1]?0:1;row[j]=Math.min(row[j]+1,row[j-1]+1,prev+cost);prev=temp}}return row[b.length]}
      function render(){const p=puzzles[index];const source=(p.problem||'').split('\n').slice(-1)[0].split(' → ')[0];const distance=p.judgement?.distance??editDistance(source,p.answer),score=p.judgement?.score??Math.max(0,Math.round((1-distance/Math.max(source.length,p.answer.length))*100));$('number').textContent=`第${index+1}問`;$('progress').textContent=`${index+1} / ${puzzles.length}`;$('puzzleTitle').textContent=p.title||'生成された謎';$('problem').textContent=p.problem;$('hint1').textContent=p.hints[0];$('hint2').textContent=p.hints[1];$('hint3').textContent=p.hints[2];$('answer').value='';$('message').textContent='';$('message').className='message';$('solution').className='solution';$('solutionAnswer').textContent=`答え：${p.answer}`;$('explanation').textContent=p.explanation;$('judgeScore').textContent=`${score}点`;$('judgeMessage').textContent=score>=50?`編集距離 ${distance}：採用候補`:`編集距離 ${distance}：除外候補`;$('next').hidden=true;$('correctCount').textContent=`正解数：${correct}`}
      function answer(){const p=puzzles[index],value=$('answer').value.trim();if(!value){$('message').textContent='答えを入力してください。';$('message').className='message wrong';return}if(value===p.answer){correct++;$('message').textContent='正解です！';$('message').className='message correct';$('solution').className='solution visible';$('correctCount').textContent=`正解数：${correct}`;$('next').hidden=index===puzzles.length-1}else{$('message').textContent='惜しいです。ヒントを確認して、もう一度考えてみてください。';$('message').className='message wrong'}}
      $('submit').onclick=answer;$('answer').addEventListener('keydown',e=>{if(e.key==='Enter')answer()});$('next').onclick=()=>{index=(index+1)%puzzles.length;render()};render();
    })();
  </script>
</body>
</html>
